<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Review Manager</h1>
        <p class="text-slate-400 text-sm mt-1">Enter your password to continue</p>
      </div>

      {% if error %}
      <div class="bg-red-950 border border-red-700 text-red-300 rounded-xl px-4 py-3 mb-5 text-sm">
        Incorrect password. Please try again.
      </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <div class="mb-5">
          <input
            type="password"
            name="password"
            placeholder="Password"
            autofocus
            required
            class="w-full bg-slate-700 border border-slate-600 text-white rounded-xl px-4 py-3
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder-slate-500"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold
                 rounded-xl py-3 transition-colors"
        >
          Sign In
        </button>
      </form>

    </div>
  </div>
</body>
</html>
